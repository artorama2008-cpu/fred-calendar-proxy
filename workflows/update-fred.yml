name: Update FRED Calendar

on:
  schedule:
    # Se ejecuta todos los días a las 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso necesario para hacer commit y push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run script to fetch FRED data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }} # Inyecta la clave de forma segura
        run: python fetch_fred.py

      - name: Commit and push if changed
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add fred_dates.json
          # Solo hace commit si el archivo ha cambiado
          git diff-index --quiet HEAD || git commit -m "chore: update FRED calendar [skip ci]"
          git push
