name: Update FRED Calendar

on:
  schedule:
    - cron: '0 6 * * *' # Diario a las 06:00 UTC
  workflow_dispatch:    # Permite ejecución manual

# Permisos necesarios para que el despliegue a Pages funcione
permissions:
  contents: write
  pages: write
  id-token: write

# Evita despliegues simultáneos
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run script to fetch FRED data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python fetch_fred.py

      # (Opcional) Guarda el JSON en el repositorio para tener un historial
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fred_dates.json
          git diff-index --quiet HEAD || git commit -m "chore: update FRED calendar [skip ci]"
          git push

      # Prepara el entorno de GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Empaqueta la carpeta actual (donde está fred_dates.json) como artefacto
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # Despliega el artefacto en GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
